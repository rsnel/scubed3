# publishes the website (doc/) on GitHub Pages, at every push to master
# that changes it (and by hand: Actions, pages, Run workflow); the source
# of Pages must be "GitHub Actions" (Settings, Pages)
name: pages

on:
  push:
    branches: [master]
    paths: ['doc/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc
      - id: deployment
        uses: actions/deploy-pages@v4
